<!DOCTYPE html>
<html><head><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-[#f8f9fa] flex items-center justify-center min-h-screen">
<div class="bg-white p-8 rounded-[24px] border w-[360px] shadow-sm">
<h1 class="text-2xl font-extrabold mb-1">Welcome to AutoZ</h1><p class="text-sm text-gray-400 mb-6">Solapur's No.1 Auction</p>
<form method="POST">{% csrf_token %}
<input name="username" placeholder="Your Name (ex: Solapur Buyer)" class="w-full border rounded-xl px-4 py-3 mb-3 text-sm outline-none focus:border-blue-500">
<input name="password" type="password" placeholder="Password" class="w-full border rounded-xl px-4 py-3 mb-4 text-sm outline-none focus:border-blue-500">
<button class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold">Login / Create Account</button>
</form>
</div></body></html>
