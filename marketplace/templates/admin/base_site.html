
{% extends "admin/base.html" %}
{% load i18n %}

{% block userlinks %}

    <!-- VIEW SITE - REACT MARKETPLACE -->
    <a href="https://autoz-frontend.onrender.com/"
       target="_blank"
       rel="noopener noreferrer">
        {% translate 'View site' %}
    </a> /

    <!-- AUTOZ BIDS DASHBOARD -->
    <a href="https://autoz-frontend.onrender.com/admin/bids/"
       target="_blank"
       rel="noopener noreferrer"
       style="color: #f0b90b; font-weight: bold;">
        AutoZ Bids
    </a> /

    <!-- CHANGE PASSWORD -->
    {% if user.has_usable_password %}
        <a href="{% url 'admin:password_change' %}">
            {% translate 'Change password' %}
        </a> /
    {% endif %}

    <!-- LOG OUT -->
    <form method="post"
          action="{% url 'admin:logout' %}"
          style="display: inline;">

        {% csrf_token %}

        <button type="submit"
                style="background: none;
                       border: none;
                       color: inherit;
                       cursor: pointer;
                       padding: 0;
                       font: inherit;">
            {% translate 'Log out' %}
        </button>

    </form>

{% endblock %}
